name: Update database

on:
  schedule:
    - cron: "15 2,14 * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Output branch (blank uses DATABASE_PUBLISH_BRANCH or main)
        default: ""
      source_ref:
        description: Private tool ref (blank uses DATABASE_SOURCE_REF or main)
        default: ""
      contract_ref:
        description: android-protos ref (blank uses CONTRACT_REF or main)
        default: ""
      force:
        description: Rebuild even when master version and contract commit match
        type: boolean
        default: false
      node_image:
        description: Node container image (can use a version from report.json)
        default: node:current-slim

permissions:
  contents: write
  packages: read

concurrency:
  group: database-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Prepare publication tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rsync openssh-client

      - name: Check out public data repository
        uses: actions/checkout@v7
        with:
          path: repo

      - name: Check out private database tool
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATABASE_SOURCE_REPOSITORY || 'holodori-net/fetch-database' }}
          ref: ${{ inputs.source_ref || vars.DATABASE_SOURCE_REF || 'main' }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          persist-credentials: false
          path: source

      - name: Check out published Android contract
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CONTRACT_REPOSITORY || 'holodori-net/android-protos' }}
          ref: ${{ inputs.contract_ref || vars.CONTRACT_REF || 'main' }}
          persist-credentials: false
          path: contract

      - name: Prepare proxy SSH configuration
        shell: bash
        env:
          PROXY_HOST: ${{ secrets.PROXY_HOST }}
          PROXY_SSH_KEY: ${{ secrets.PROXY_SSH_KEY }}
        run: |
          test -n "$PROXY_HOST"
          test -n "$PROXY_SSH_KEY"
          mkdir -p "$RUNNER_TEMP/proxy-ssh"
          chmod 700 "$RUNNER_TEMP/proxy-ssh"
          printf '%s\n' "$PROXY_SSH_KEY" | tr -d '\r' > "$RUNNER_TEMP/proxy-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/proxy-ssh/id_ed25519"
          if ! ssh-keygen -y -P '' -f "$RUNNER_TEMP/proxy-ssh/id_ed25519" >/dev/null; then
            echo '::error::PROXY_SSH_KEY must contain a readable OpenSSH private key'
            exit 1
          fi
          ssh-keyscan -T 10 -t ed25519 -H "$PROXY_HOST" > "$RUNNER_TEMP/proxy-ssh/known_hosts" 2>/dev/null
          test -s "$RUNNER_TEMP/proxy-ssh/known_hosts"
          ssh-keygen -F "$PROXY_HOST" -f "$RUNNER_TEMP/proxy-ssh/known_hosts" >/dev/null
          chmod 644 "$RUNNER_TEMP/proxy-ssh/known_hosts"
          cat > "$RUNNER_TEMP/proxy-ssh/config" <<EOF
          Host proxy
            HostName $PROXY_HOST
            User actions-proxy
            IdentityFile /ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 10
            ServerAliveInterval 30
            ServerAliveCountMax 3
            StrictHostKeyChecking yes
            UserKnownHostsFile /ssh/known_hosts
          EOF
          chmod 600 "$RUNNER_TEMP/proxy-ssh/config"

      - name: Verify proxy SSH access
        shell: bash
        env:
          SSH_DIRECTORY: ${{ runner.temp }}/proxy-ssh
        run: |
          sed "s|/ssh/|$SSH_DIRECTORY/|g" "$SSH_DIRECTORY/config" > "$SSH_DIRECTORY/runner-config"
          chmod 600 "$SSH_DIRECTORY/runner-config"
          if ! ssh -F "$SSH_DIRECTORY/runner-config" -T proxy true; then
            ssh-keygen -lf "$SSH_DIRECTORY/id_ed25519" || true
            exit 1
          fi

      - name: Fetch and publish database
        uses: ./source
        with:
          target-path: ${{ github.workspace }}/repo
          contract-path: ${{ github.workspace }}/contract
          target-branch: ${{ inputs.target_branch || vars.DATABASE_PUBLISH_BRANCH || 'main' }}
          force: ${{ inputs.force && 'true' || 'false' }}
          node-image: ${{ inputs.node_image || 'node:current-slim' }}
          base-url: ${{ vars.DATABASE_BASE_URL || 'https://jp.game-hololive-dreams.com' }}
          ssh-directory: ${{ runner.temp }}/proxy-ssh

      - name: Remove proxy SSH configuration
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/proxy-ssh"
